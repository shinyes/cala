org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Disable Kotlin incremental compilation.
#
# Symptom it avoids: Android builds fail with the misleading message
#   "Could not close incremental caches in .../caches-jvm/jvm/kotlin"
# The real cause is buried in a suppressed exception:
#   IllegalArgumentException: this and base files have different roots:
#     C:\Users\<user>\AppData\Local\Pub\Cache\...\SomePlugin.kt
#     D:\path\to\project\android
# Kotlin's incremental compiler calls Path.relativize() when flushing its cache,
# and on Windows that throws when the two paths are on different drives.
#
# Why disable it here instead of only documenting the env-var fix:
# the root-cause fix is "keep the pub cache on the same drive as the project"
# (PUB_CACHE=D:\...), but an environment variable only reaches processes started
# AFTER it is set. Terminals, IDEs and build servers that were already running
# keep the stale environment, so the failure returns unpredictably:
# debug builds succeed while release builds fail, or vice versa.
# A repository should not depend on how the shell was launched.
#
# Cost: local repeat builds lose Kotlin incremental compilation (tens of seconds).
# CI is unaffected: every CI build is cold, so there is no incremental state to
# reuse in the first place.
#
# If you want the faster local builds back, fix the root cause instead:
# put the pub cache on the same drive as this project, then set this back to true.
#   PowerShell: [Environment]::SetEnvironmentVariable("PUB_CACHE","D:\Programs\Pub\Cache","User")
# See README.md for details.
kotlin.incremental=false

# NOTE: keep this file ASCII-only. The Flutter tool reads it as UTF-8, and
# Windows PowerShell 5.1's Add-Content/Set-Content default to the system ANSI
# code page (GBK on zh-CN), which silently produces invalid UTF-8 here.
