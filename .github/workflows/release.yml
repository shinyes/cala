name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # 创建 Release 并上传附件
  packages: write # 推送 ghcr.io

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # 前置校验：把所有「配置缺失/配置错误」类问题集中在这里失败，并给出可读信息。
  # 否则它们会在后续 job 里以晦涩的 keytool / gradle 错误暴露，排查成本高。
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - uses: actions/checkout@v6

      # preflight 会用 keytool 试开 keystore，因此这里显式准备 JDK。
      # 不依赖 runner 镜像自带的 Java：其版本随镜像变动，keytool 行为也可能不同。
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 从 tag 推导版本号
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag '$tag' 不是 v<major>.<minor>.<patch> 形式（例如 v1.2.3）"
            exit 1
          fi
          IFS='.' read -r major minor patch <<< "$version"
          # versionCode 必须随版本单调递增，否则 Android 会拒绝覆盖安装。
          # major*1_000_000 + minor*1_000 + patch 在 minor/patch < 1000 时严格单调。
          if [ "$minor" -ge 1000 ] || [ "$patch" -ge 1000 ]; then
            echo "::error::minor 与 patch 必须小于 1000（当前 $minor.$patch）"
            exit 1
          fi
          code=$(( major * 1000000 + minor * 1000 + patch ))
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$code" >> "$GITHUB_OUTPUT"
          echo "版本 $version，versionCode=$code"

      - name: 校验 4 个签名 secret 均已配置
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${KS_B64:-}" ]    || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "${KS_PASS:-}" ]   || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "${KEY_ALIAS:-}" ] || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "${KEY_PASS:-}" ]  || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::缺少以下 repository secret:$missing"
            echo "请在 Settings > Secrets and variables > Actions 中配置（需为仓库级；"
            echo "若设为环境级，job 必须声明 environment: 否则会解析为空字符串）。"
            exit 1
          fi
          echo "4 个签名 secret 均已配置。"

      - name: 校验 keystore 可解码、能打开，且别名存在
        id: keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          # 去掉可能的空白与换行：用 certutil 生成过的 base64 会带 header 并折行
          printf '%s' "$KS_B64" | tr -d ' \t\r\n' | base64 -d > "$RUNNER_TEMP/preflight.jks" \
            || { echo "::error::ANDROID_KEYSTORE_BASE64 不是合法 base64"; exit 1; }

          size=$(stat -c%s "$RUNNER_TEMP/preflight.jks")
          if [ "$size" -lt 100 ]; then
            echo "::error::解码后的 keystore 仅 $size 字节，内容疑似不正确"
            exit 1
          fi

          if ! keytool -list -keystore "$RUNNER_TEMP/preflight.jks" -storepass "$KS_PASS" > /dev/null 2>&1; then
            echo "::error::keystore 无法打开：ANDROID_KEYSTORE_PASSWORD 错误，或文件损坏"
            exit 1
          fi
          echo "keystore 可打开（$size 字节）"

          # 打印其中的私钥条目别名。
          # 别名不是机密（真正的机密是 keystore 文件与口令，签名需要两者兼备），
          # 把它显示出来，secret 填错时就能一眼看到正确值，不必再来一轮。
          echo "keystore 中的私钥条目别名："
          keytool -list -keystore "$RUNNER_TEMP/preflight.jks" -storepass "$KS_PASS" 2>/dev/null \
            | grep -i 'PrivateKeyEntry' | sed 's/,.*//' | sed 's/^/  /' \
            || echo "  （没有找到私钥条目——该 keystore 无法用于签名）"

          # 别名规范化：只保留别名可能出现的字符（字母、数字、下划线、连字符、点）。
          #
          # 为什么不是简单的修剪空白：从网页粘贴到 secret 输入框时，带进来的可能
          # 不只是普通空格 —— 实测确认零宽空格 U+200B 能穿过 `tr -d ' \t\r\n'`
          # （该写法只处理 ASCII），NBSP(U+00A0) 与全角空格(U+3000) 同样会穿过，
          # 而它们都不可见，表现为「别名看起来完全正确却找不到条目」。
          #
          # 激进规范化在这里是**安全**的：下一步会用规范化结果去 keystore 里
          # 实际查找，找不到就硬失败。因此不存在「把错误别名悄悄改成另一个可用别名、
          # 从而用错密钥签名」的风险 —— 只会命中用户显式填写的那个别名。
          alias_normalized="$(printf '%s' "$KEY_ALIAS" | tr -cd 'A-Za-z0-9_.-')"
          if [ -z "$alias_normalized" ]; then
            echo "::error::ANDROID_KEY_ALIAS 为空或只含不可见字符。请把上面列出的别名填入该 secret。"
            exit 1
          fi
          if [ "$alias_normalized" != "$KEY_ALIAS" ]; then
            echo "::warning::ANDROID_KEY_ALIAS 含空格或不可见字符，已规范化为 '$alias_normalized'（建议清理该 secret）"
          fi

          if ! keytool -list -keystore "$RUNNER_TEMP/preflight.jks" -storepass "$KS_PASS" \
                 -alias "$alias_normalized" > /dev/null 2>&1; then
            # 把**实际存在的别名**放进 annotation，而不只是日志里。
            # 理由：失败注解可在 Checks 界面直接看到，也能通过公开 API 读取，
            # 无需翻构建日志（日志需要认证）。别名不是机密——签名需要同时具备
            # keystore 文件与两个口令，仅知道别名没有任何用处；
            # Android 官方文档与大量公开仓库都把别名当作非敏感信息
            # （本项目自己的 key.properties.example 里也写着 keyAlias=cala）。
            # 这让「secret 填错」这类问题一次就能定位，而不必反复试错。
            available="$(keytool -list -keystore "$RUNNER_TEMP/preflight.jks" -storepass "$KS_PASS" 2>/dev/null \
              | grep -i 'PrivateKeyEntry' | sed 's/,.*//' | tr -d ' ' | tr '\n' ',' | sed 's/,$//' || true)"
            echo "::error::ANDROID_KEY_ALIAS 在 keystore 中不存在。keystore 里实际可用的别名: ${available:-（未找到任何私钥条目）}"
            exit 1
          fi
          echo "别名 '$alias_normalized' 校验通过"

          rm -f "$RUNNER_TEMP/preflight.jks"

      - name: 断言签名材料未被提交入库
        run: |
          set -euo pipefail
          failed=0
          if git ls-files --error-unmatch app/android/key.properties > /dev/null 2>&1; then
            echo "::error::app/android/key.properties 已被提交入库。"
            echo "必须从历史中移除该文件，并**更换 keystore**（口令已泄露）。"
            failed=1
          fi
          if git ls-files | grep -Ei '\.(jks|keystore)$'; then
            echo "::error::仓库中存在 keystore 文件。必须移除并更换 keystore。"
            failed=1
          fi
          [ "$failed" -eq 0 ] || exit 1
          echo "签名材料未入库。"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      # tag 可能打在未经 CI 的提交上，因此发布前必须自己跑一遍测试。
      # 其中包含跨端判分语料门禁（13872 条向量），这是 A12 的唯一防线 ——
      # 若语料与实现不一致，这里会失败，从而阻止一个「界面显示答对、落库记为错」
      # 的版本被发布出去。
      - name: 后端测试
        working-directory: backend
        env:
          CGO_ENABLED: '0'
        run: go test ./... -count=1 -timeout 600s

      - name: 前端测试
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

  image:
    name: Docker 镜像
    runs-on: ubuntu-latest
    needs: [preflight, test]
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 仅构建 linux/amd64：目标场景是 x86 服务器；arm64 需要 QEMU，
      # 构建时间翻倍而收益不明。若日后需要，加一行 platforms 即可。
      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ needs.preflight.outputs.version }}
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 功能 10 原文要求「镜像文件上传到 release」，故同时产出 tar.gz 附件，
      # 使离线环境也能 docker load。
      - name: 导出镜像为 tar.gz
        run: |
          set -euo pipefail
          version="${{ needs.preflight.outputs.version }}"
          docker pull "${IMAGE}:${version}"
          docker save "${IMAGE}:${version}" | gzip -9 > "cala-${version}-linux-amd64.tar.gz"
          ls -lh "cala-${version}-linux-amd64.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: cala-*-linux-amd64.tar.gz
          retention-days: 7

  apk:
    name: 已签名 APK
    runs-on: ubuntu-latest
    needs: [preflight, test]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: 解码 keystore 并生成 key.properties
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          # 口令经环境变量传入，**不要**直接把它插值进脚本文本：
          # 未加引号的 heredoc 会对其内容做参数展开，
          # 于是口令里若含 $ 或反引号就会被 shell 静默改写，
          # 表现为「口令明明是对的却签名失败」。
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # 这里重新读取 secret 并**本地规范化**，而不是取 preflight 的 job output。
          #
          # 原因（记录一次实测失败）：曾把规范化后的别名经 `key_alias` job output
          # 传给本 job，运行时却取到空值（run #34568800826）。同一 job 的
          # `version` output 工作正常，且两处引用文本、step id、needs 声明都经核对无误；
          # 而本环境无法读取 Actions 日志（API 需认证），无法进一步定位。
          #
          # 取舍：与其继续靠猜测消耗发布轮次，不如去掉这个跨 job 依赖。
          # 重复的只是一行**纯确定性转换**（规范化），而真正需要单一 owner 的
          # **校验**仍然只在 preflight 一处（那里会硬失败并列出可用别名）。
          # 决策权也仍在用户手里：别名取自 secret，工具不代为选择。
          RESOLVED_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          printf '%s' "$KS_B64" | tr -d ' \t\r\n' | base64 -d > "$RUNNER_TEMP/release.jks"

          # 与 preflight 相同的规范化：只保留别名可能出现的字符。
          # 剥离的是不可见字符（NBSP、全角空格、零宽空格等），
          # preflight 已确保规范化后的名字确实存在于 keystore 中。
          alias_normalized="$(printf '%s' "$RESOLVED_ALIAS" | tr -cd 'A-Za-z0-9_.-')"
          if [ -z "$alias_normalized" ]; then
            echo "::error::ANDROID_KEY_ALIAS 为空或只含不可见字符"
            exit 1
          fi

          # heredoc 只展开下面这些我们自己设定的变量；其值不会再被二次展开。
          cat > app/android/key.properties <<EOF
          storePassword=${KS_PASS}
          keyPassword=${KEY_PASS}
          keyAlias=${alias_normalized}
          storeFile=$RUNNER_TEMP/release.jks
          EOF

          # key.properties 必须以换行结尾，否则 Java 的 Properties 读取时
          # 可能忽略最后一行（不同实现对此处理不一致，明确保证更稳妥）。
          printf '\n' >> app/android/key.properties

          # 只确认文件就位，绝不打印内容（含口令）
          test -s app/android/key.properties && echo "key.properties 已生成"
          test -s "$RUNNER_TEMP/release.jks" && echo "keystore 已就位"
          echo "使用别名: $alias_normalized"
          echo "key.properties 行数: $(wc -l < app/android/key.properties)"

      - name: 构建 release APK
        working-directory: app
        run: |
          set -euo pipefail
          flutter pub get
          # 通用 APK（非 --split-per-abi）：侧载场景下「该下载哪个文件」的选错风险
          # 大于十几 MB 的体积收益（规格 §10.3）。
          flutter build apk --release \
            --build-name="${{ needs.preflight.outputs.version }}" \
            --build-number="${{ needs.preflight.outputs.version_code }}"

      - name: 验签并断言不是 debug 证书
        run: |
          set -euo pipefail
          apk="app/build/app/outputs/flutter-apk/app-release.apk"
          test -f "$apk" || { echo "::error::未找到 $apk"; exit 1; }

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          apksigner="$(find "$sdk_root/build-tools" -name apksigner -type f | sort -V | tail -1)"
          echo "使用 $apksigner"
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"

          # 这是 D18 的最后一道防线：debug 签名的 APK 绝不可发布
          # （有效期短，且 keystore 更换会导致无法覆盖安装升级）。
          if grep -qi 'Android Debug' "$RUNNER_TEMP/certs.txt"; then
            echo "::error::APK 使用了 debug 证书，绝不可发布（设计规格 D18）"
            exit 1
          fi
          "$apksigner" verify "$apk"
          echo "签名校验通过，且不是 debug 证书。"

      - name: 重命名产物
        run: |
          set -euo pipefail
          version="${{ needs.preflight.outputs.version }}"
          mkdir -p out
          cp app/build/app/outputs/flutter-apk/app-release.apk "out/cala-${version}.apk"
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk
          retention-days: 7

      - name: 清理签名材料
        if: always()
        run: rm -f app/android/key.properties "$RUNNER_TEMP/release.jks"

  # 容器冒烟测试：在**真实 Docker** 中按 docker-compose.yml 的同一配置启动镜像，
  # 验证它能写入数据目录并正常工作。
  #
  # 为什么需要这个 job（它本可以拦下一个真实缺陷）：
  # v0.0.1 的镜像里**不存在 /data**，而容器以 nonroot(uid 65532) 运行。
  # Docker 挂载命名卷时会新建该目录并归属 root:root，于是 nonroot 无法创建 cala.db，
  # 服务启动即失败（数据库初始化失败: unable to open database file），容器 crash-loop。
  # 这个缺陷在「构建成功 + 镜像已推送」的情况下完全不可见 ——
  # 只有真正把容器跑起来并写一次数据才会暴露。
  #
  # 本 job 的注册步骤是关键的：注册会写 user 表，因此它同时证明了
  # ①容器能启动 ②nonroot 能写入 /data ③数据库可用。
  smoke:
    name: 容器冒烟测试
    runs-on: ubuntu-latest
    needs: [preflight, image]
    steps:
      - name: 拉取刚发布的镜像
        run: docker pull "${IMAGE}:${{ needs.preflight.outputs.version }}"

      - name: 以命名卷启动（与 docker-compose.yml 相同的配置）
        run: |
          set -euo pipefail
          docker volume create cala-smoke-data
          docker run -d --name cala-smoke \
            -p 18080:8080 \
            -v cala-smoke-data:/data \
            -e CALA_DB=/data/cala.db \
            -e CALA_ADDR=:8080 \
            -e CALA_REGISTRATION_OPEN=true \
            "${IMAGE}:${{ needs.preflight.outputs.version }}"

      - name: 等待健康检查通过
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/api/healthz > /dev/null 2>&1; then
              echo "健康检查通过（第 ${i} 次尝试）"
              curl -s http://127.0.0.1:18080/api/healthz; echo
              exit 0
            fi
            sleep 1
          done
          echo "::error::容器在 30 秒内未通过健康检查 —— 很可能无法写入 /data"
          echo "--- 容器日志 ---"
          docker logs cala-smoke || true
          echo "--- 容器状态 ---"
          docker inspect -f 'status={{.State.Status}} exit={{.State.ExitCode}} restarts={{.RestartCount}}' cala-smoke || true
          exit 1

      - name: 断言容器未在 crash-loop
        run: |
          set -euo pipefail
          state=$(docker inspect -f '{{.State.Status}}' cala-smoke)
          restarts=$(docker inspect -f '{{.RestartCount}}' cala-smoke)
          echo "状态=$state 重启次数=$restarts"
          if [ "$state" != "running" ] || [ "$restarts" != "0" ]; then
            echo "::error::容器状态异常（非 running 或发生重启）"
            docker logs cala-smoke || true
            exit 1
          fi

      - name: 验证 nonroot 能写入数据目录（注册首个用户）
        run: |
          set -euo pipefail
          # 注册会写 user 表，因此这一步是「数据目录可写」的直接证据
          resp=$(curl -fsS -X POST http://127.0.0.1:18080/api/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"username":"smokeadmin","password":"password123"}')
          echo "$resp"
          case "$resp" in
            *'"becameAdmin":true'*) echo "首个用户已成为管理员 ✓" ;;
            *) echo "::error::首个用户应成为管理员"; exit 1 ;;
          esac

      - name: 重启容器，验证数据确实持久化在卷中
        run: |
          set -euo pipefail
          docker restart cala-smoke > /dev/null
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18080/api/healthz > /dev/null 2>&1 && break
            sleep 1
          done
          # 重启后仍能用刚才的账号登录 -> 数据确实写进了命名卷（而非容器可写层）
          curl -fsS -X POST http://127.0.0.1:18080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"smokeadmin","password":"password123"}' \
            | grep -q '"token"' || { echo "::error::重启后无法登录，数据未持久化"; docker logs cala-smoke; exit 1; }
          echo "数据已持久化到命名卷 ✓"

      - name: 清理
        if: always()
        run: |
          docker logs cala-smoke > /dev/null 2>&1 || true
          docker rm -f cala-smoke > /dev/null 2>&1 || true
          docker volume rm cala-smoke-data > /dev/null 2>&1 || true

  release:
    name: 创建 Release
    runs-on: ubuntu-latest
    needs: [preflight, image, apk, smoke]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 必须**显式指定** artifact 名，不能用不带 name 的 download-artifact（下载全部）。
      # 原因（实测，run #34569828481）：docker/build-push-action 的
      # cache-to: type=gha 会在本次运行中创建一个名为
      #   <owner>~<repo>~<hash>.dockerbuild
      # 的构建缓存条目，它以 artifact 的形式出现在 runs/{id}/artifacts 列表里。
      # 「下载全部」会连带去取这个缓存 blob，并当作 zip 解压 ——
      # 它不是标准 artifact，于是报
      #   "Unable to download and extract artifact: Artifact download failed after 5 retries"
      # 连累整个 release job 失败。
      - name: 下载镜像 tar.gz
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: dist

      - name: 下载 APK
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist

      - name: 列出待发布文件
        run: find dist -type f | sort

      - name: 生成 Release 说明
        run: |
          set -euo pipefail
          version="${{ needs.preflight.outputs.version }}"
          image="${IMAGE}"
          cat > notes.md <<EOF
          ## Cala ${version}

          ### 部署（Docker）

          \`\`\`bash
          docker pull ${image}:${version}
          docker run -d --name cala -p 8080:8080 \\
            -v cala-data:/data \\
            -e CALA_REGISTRATION_OPEN=true \\
            ${image}:${version}
          \`\`\`

          > **若镜像是私有包**（仓库为私有仓库时 ghcr 包默认为私有），
          > 上面的 \`docker pull\` 需要先登录：
          >
          > \`\`\`bash
          > echo "<你的 GitHub PAT，需 read:packages 权限>" | docker login ghcr.io -u <你的用户名> --password-stdin
          > \`\`\`
          >
          > 想让任何人都能直接拉取，请在 GitHub 的
          > Packages → cala → Package settings 中把可见性改为 Public。

          首次启动后打开 http://localhost:8080 注册 —— **第一个注册的用户会成为管理员**。
          注册完成后建议在「我的」页关闭注册开关。

          离线环境可用附件里的 \`cala-${version}-linux-amd64.tar.gz\`：

          \`\`\`bash
          docker load < cala-${version}-linux-amd64.tar.gz
          \`\`\`

          ### Android

          下载 \`cala-${version}.apk\` 侧载安装，已用正式密钥签名。

          ### 说明

          - 镜像仅 linux/amd64
          - APK 为通用包（含全部 ABI），未按 ABI 拆分
          EOF
          cat notes.md

      - name: 创建 Release 并上传附件
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ needs.preflight.outputs.version }}"
          gh release create "v${version}" \
            --title "Cala ${version}" \
            --notes-file notes.md \
            dist/cala-*.tar.gz dist/cala-*.apk
