# Cala 后端 —— 自建镜像的 compose 配置
#
#   docker compose -f docker-compose.build.yml up -d --build
#
# 用途：从本仓库源码构建镜像（本地开发、或不想用已发布镜像时）。
# 部署请用 docker-compose.yml（拉取已发布镜像，无需构建）。
#
# 两者环境变量与卷配置保持一致，差别只在镜像来源。

services:
  cala:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # 自建镜像打个本地标签，避免与 ghcr 上的同名镜像混淆。
    image: cala:local
    container_name: cala-local
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      CALA_ADDR: ":8080"
      CALA_DB: /data/cala.db
      CALA_SESSION_TTL: 720h
      CALA_REGISTRATION_OPEN: "true"
      # 开发期若用 flutter run -d chrome 调试，把来源填进来；
      # 例如 "http://localhost:3000"（端口按 flutter 实际输出调整）。
      CALA_DEV_CORS_ORIGINS: ""

    volumes:
      # 与部署配置分开命名，避免自建与已发布镜像共用同一份数据时互相干扰。
      - cala-local-data:/data

    security_opt:
      - no-new-privileges:true

volumes:
  cala-local-data:
